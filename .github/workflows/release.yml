name: Release
# Push a tag like v1.0.0 and this builds the three desktop zips + the Android APK and attaches them to a release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build.py dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk g-script.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: android/g-script.apk
